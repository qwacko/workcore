name: Release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to verify, e.g. v0.1.0 (never publishes)'
        required: true
        type: string

permissions:
  contents: read

# Serialize releases, not just runs for the same version. Never cancel a publish.
concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release tag, package versions, repository and notes
        run: node scripts/release.mjs check
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          ADMIN_BUILD_ID: ${{ github.sha }}
      - run: node scripts/package-smoke.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - run: pnpm docs:build
      - name: Pack the checked packages and record integrity
        run: node scripts/release.mjs pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release
          path: release/
          if-no-files-found: error
          retention-days: 90

  assets:
    name: Attach verified packages to the release
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release
          path: release/
      - name: Attach without replacing different existing assets
        run: node scripts/release.mjs attach
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    name: Publish to npm
    # Opt in only after scope ownership, initial package creation and npm OIDC setup.
    # Manual workflow_dispatch runs ALWAYS stop at verification/artifact generation.
    if: github.event_name == 'release' && vars.NPM_PUBLISH_ENABLED == 'true'
    needs: [verify, assets]
    environment: npm-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release
          path: release/
      # npm (not pnpm) performs the OIDC exchange. These tarballs are already
      # packed by pnpm, so their exports/dependency versions have been rewritten.
      - run: npm install --global npm@11.21.0 --registry=https://registry.npmjs.org
      - name: Publish exact verified tarballs, dependencies first
        run: node scripts/release.mjs publish
