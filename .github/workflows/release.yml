name: Release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to verify, e.g. v0.1.0 (never publishes)'
        required: true
        type: string

permissions:
  contents: read

# Serialize releases, not just runs for the same version. Never cancel a publish.
concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (Node 24)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release tag, package versions, repository and notes
        run: node scripts/release.mjs check
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          ADMIN_BUILD_ID: ${{ github.sha }}
      - run: node scripts/package-smoke.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - run: pnpm docs:build
      - name: Pack the checked packages and record integrity
        run: node scripts/release.mjs pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: npm-release
          path: release/
          if-no-files-found: error
          retention-days: 90

  assets:
    name: Attach verified packages to the release
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          name: npm-release
          path: release/
      - name: Attach without replacing different existing assets
        run: node scripts/release.mjs attach
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    name: Publish to npm
    # Opt in only after scope ownership, initial package creation and npm OIDC setup.
    # Manual workflow_dispatch runs ALWAYS stop at verification/artifact generation.
    if: github.event_name == 'release' && vars.NPM_PUBLISH_ENABLED == 'true'
    needs: [verify, assets]
    environment: npm-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          name: npm-release
          path: release/
      # npm (not pnpm) performs the OIDC exchange. These tarballs are already
      # packed by pnpm, so their exports/dependency versions have been rewritten.
      - run: npm install --global npm@11.21.0 --registry=https://registry.npmjs.org
      - name: Publish exact verified tarballs, dependencies first
        run: node scripts/release.mjs publish
